plugins {
    id 'com.android.application'
}
android {
    namespace 'com.abhixfflive.punch'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abhixfflive.punch'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'dev.rikka.shizuku:api:13.1.5'
}
